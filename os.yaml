# os.yaml — Prime Realty OS · Pucho OS v5.1.1 · step 2 (decide the OS)
# Sources: intake/prime-realty-problem-card.md (R1–R22, X1–X6, G1–G9), realstate_dashboard_v2.html, Real Estate AI Agent.json.
# ⚑ = assumption to confirm with Prime Realty (gaps G1–G9).
#
# Flow split (rule zero, method/ai-pipeline.md):
#   · Built by build_flows.py from this file (app-called, no AI): MESSAGES.reply, VISITS.schedule_visit, VISITS.confirm_client.
#   · Built at step 6 on the custom-flow path (tools/build_primerealty_flows.py + flowkit), because build_flows cannot express them:
#       PR - WA_AGENT     inbound WhatsApp → read lead + last 20 messages + matching inventory (CODE) → ONE llm-ai call {intent, fields, reply}
#                         → parse (declared keys only) → router on intent → booking / follow-up writes → reply → Return
#       PR - VOICE_AGENT  VAPI caller turn → same brain, sync answer to VAPI, calls row + transcript
#       PR - FOLLOWUP_RUN schedule every 4 h → due follow-ups → template 1/2/3 (CODE picks) → pucho-whatsapp template → update → Return (no AI)
#     Each writes only through /api/data with INBOUND_TOKEN. They are traced through rules_in_code below.

os:
  name: Prime Realty OS
  slug: prime-realty-os
  client: Prime Realty India, Bhopal
  client_short: PR
  one_liner: Every WhatsApp and phone enquiry answered by the AI agent at once, booked for a site visit with the right broker, and followed up until it closes.
  tagline: AI lead desk for Prime Realty — WhatsApp and voice in, site visits and bookings out.
  languages: [en, hi]
  volume_per_month: 1140          # ⚑ inbound WhatsApp messages (142 leads × 8), gap G1
  success_metric: Site visits booked per month and lead → booking conversion (sample 142 → 38, 27 %)
  plan: team
  brand: { color: "#1A6BFF", name: Prime Realty }
  audit: true
  limits: { actions_per_day: 600 }

design:
  tone: pucho
  shell: sidebar
  direction: "An office desk used all day: the inbox and the visit list first, numbers second"
  sidebar: { action: { label: Add lead, page: leads, modal: add_lead } }

requirements:
  - { id: R1, text: "A Client who sends a WhatsApp message from a new number becomes a lead, deduplicated on phone" }
  - { id: R2, text: "The AI agent replies to the Client on WhatsApp in the Client's own language" }
  - { id: R3, text: "The AI agent asks the Client for location, budget, BHK and purpose" }
  - { id: R4, text: "The AI agent offers the Client only available properties that match location, budget, BHK and type" }
  - { id: R5, text: "When the Client agrees to a visit, a site-visit booking is created for the chosen property and date" }
  - { id: R6, text: "Each new booking is assigned to a Broker by property type: residential, commercial or plots" }
  - { id: R7, text: "The assigned Broker receives a WhatsApp alert with the Client's name, phone, property, budget and visit time" }
  - { id: R8, text: "When the Client says busy or \"baad mein\", the lead is queued for follow-up" }
  - { id: R9, text: "Up to three follow-up messages go to a queued Client on a fixed schedule, then the follow-up stops" }
  - { id: R10, text: "The AI agent answers a Client's inbound voice call and the call, transcript and outcome are stored" }
  - { id: R11, text: "The Office admin can take over a conversation from the AI agent and reply by hand" }
  - { id: R12, text: "The Office admin can add a property with name, type, location, price range, BHK, area, status and tags" }
  - { id: R13, text: "The Office admin can confirm a booking for a Client and assign the Broker by hand" }
  - { id: R14, text: "The Office admin sees total leads, bookings confirmed, active properties and revenue pipeline for the month" }
  - { id: R15, text: "The Office admin sees the lead funnel from total leads to booking confirmed, and the lead sources" }
  - { id: R16, text: "The Office admin sees each Broker's leads, closed deals, revenue and the assignment log" }
  - { id: R17, text: "The Office admin sees each automation's runs and failures" }
  - { id: R18, text: "A Broker signs in and sees only the leads, visits and conversations assigned to them" }
  - { id: R19, text: "The Office admin sets the agent name, language, follow-up interval, maximum follow-ups and company details" }
  - { id: R20, text: "A lead moves through stages New → Engaged → Visit scheduled → Booked or Lost" }
  - { id: R21, text: "The AI agent stops replying to a Client while the Office admin has taken over the conversation" }
  - { id: R22, text: "A follow-up stops as soon as the Client replies" }

roles:
  - { key: admin,  label: Office admin, desc: "Runs the desk: inbox, leads, site visits, inventory, brokers and the AI agent", home: /,
      pages: [overview, inbox, leads, visits, followups, inventory, calls, ai_agents, agent_settings, brokers, settings], demo: { email: admin@primerealty.pucho.ai, password: admin12345, name: Arvind Kumar } }
  - { key: broker, label: Broker, desc: "Works the site visits and leads assigned to them", home: /my-visits,
      pages: [my_visits, my_leads, my_followups, settings],
      scope: { leads: Broker, bookings: Broker, followups: Broker, messages: Broker, calls: Broker },
      demo: { email: rajesh@primerealty.pucho.ai, password: broker12345, name: Rajesh Kumar } }

journeys:
  - { role: admin, does: "Answer a client the AI handed over", lands: inbox,
      steps: ["Inbox opens on the newest conversation", "Take over", "Type the reply and send"] }
  - { role: admin, does: "Book a site visit for a lead", lands: leads,
      steps: ["Leads opens on the board", "Book site visit on the lead", "Pick property, broker and time — Book"] }
  - { role: admin, does: "Assign an unassigned lead", lands: overview,
      steps: ["Dashboard opens on Needs action", "Assign on the first Unassigned row", "Pick the broker — Assign"] }
  - { role: broker, does: "Record how today's visit went", lands: my_visits,
      steps: ["My site visits opens on Today", "Call the client from the row", "Visit outcome — Visited / Booked / Cancelled"] }

metrics:
  leads_month:    { entity: leads,     label: Leads this month,     where: "Created_At in month", tone: info, icon: Inbox }
  unassigned:     { entity: leads,     label: Unassigned,           where: "Broker is empty and Stage not in [Booked, Lost]", tone: warn, icon: UserX }
  taken_over:     { entity: leads,     label: Taken over from AI,   where: "AI_Mode=Off and Stage not in [Booked, Lost]", tone: info, icon: Hand }
  visits_open:    { entity: bookings,  label: Visits scheduled,     where: "Status=Scheduled", tone: info, icon: CalendarCheck }
  visits_today:   { entity: bookings,  label: Visits today,         where: "Visit_At=today and Status=Scheduled", tone: warn, icon: CalendarClock }
  booked_month:   { entity: bookings,  label: Booked this month,    where: "Status=Booked and Created_At in month", tone: ok, icon: BadgeCheck }
  pipeline_value: { entity: bookings,  label: Revenue pipeline,     where: "Status in [Scheduled, Visited]", sum: Budget_INR, format: money_l, tone: info, icon: IndianRupee }
  followups_due:  { entity: followups, label: Follow-ups due,       where: "Next_Due_At<=today and Status=Pending", tone: warn, icon: BellRing }
  active_props:   { entity: properties, label: Active properties,   where: "Status in [Available, Under Negotiation]", tone: info, icon: Building2 }
  failed_runs:    { entity: agent_runs, label: Failed runs,         where: "Status=Failed", tone: bad, icon: AlertTriangle }

entities:
  - name: leads
    id: { column: Lead_ID, prefix: "LD-" }
    created: Created_At
    title: Name
    subtitle: [Area_Pref]
    owner: Broker
    due: { column: Next_Followup_At, closed: "Stage in [Booked, Lost]" }
    contact: { phone: Phone, whatsapp: Phone }
    status: { column: Stage, values: [New, Engaged, Visit Scheduled, Booked, Lost] }
    columns: [Lead_ID, Created_At, Name, Phone, Source, Stage, Purpose, Property_Type, BHK, Area_Pref, Budget_Min_INR, Budget_Max_INR, Property_Interest, Broker, AI_Mode, Lang, Last_Message, Last_Message_At, Next_Followup_At, Followup_Reason, Lost_Reason, Summary, History]
    # Last_Message / Last_Message_At = the CLIENT's last message (the 24-hour window, follow-up replies). History = the last 20 turns,
    # kept by the agent flows so a turn never reads the whole messages table. Followup_Reason set by the agent on "baad mein".
    fields:
      Followup_Reason: { one_of: [Busy, No reply, Asked for later] }
      Phone:          { type: phone, unique: true }
      Source:         { one_of: [WhatsApp, Voice, Walk-in, Referral] }
      Purpose:        { one_of: [Buy, Rent, Invest] }
      Property_Type:  { one_of: [Residential, Commercial, Plot] }
      AI_Mode:        { one_of: ["On", "Off"] }
      Lang:           { one_of: [Hinglish, Hindi, English] }
      Budget_Min_INR: { type: number, min: 0 }
      Budget_Max_INR: { type: number, min: 0 }
    transitions:
      New:             [Engaged, Visit Scheduled, Lost]
      Engaged:         [Visit Scheduled, Lost]
      Visit Scheduled: [Booked, Engaged, Lost]
      Lost:            [Engaged]
    requires_on:
      Lost: [Lost_Reason]
    seed: 12
    examples:
      - { Lead_ID: LD-2026-0141, Created_At: "2026-08-06T10:32:00+05:30", Name: Ramesh Singh, Phone: "+919876543210", Source: WhatsApp, Stage: Visit Scheduled, Purpose: Buy, Property_Type: Residential, BHK: 3 BHK, Area_Pref: Kolar Road, Budget_Min_INR: 6500000, Budget_Max_INR: 7500000, Property_Interest: 3BHK Luxury Apartment, Broker: Rajesh Kumar, AI_Mode: "On", Lang: Hinglish, Last_Message: "Bhai 3BHK ka price kya hoga final?", Last_Message_At: "2026-08-06T10:38:00+05:30", Next_Followup_At: "2026-08-08T11:00:00+05:30", Summary: "3BHK on Kolar Road, budget around ₹70 L, self-use; visit this weekend" }
