  - id: inbox
    covers: [R11, R21]
    route: /inbox
    group: Main
    label: Inbox
    icon: MessagesSquare
    desc: Every WhatsApp and call conversation — take over from the AI agent and reply by hand
    subtitle: Read what the AI agent said, take over when a client needs a person, hand back when done
    entity: messages
    roles: [admin]
    export: false                  # a chat screen, not a register — no Export button (client request, 3 Nov 2026)
    badge: { entity: leads, where: "AI_Mode=Off and Stage not in [Booked, Lost]" }
    blocks:
      - { type: custom, name: ConversationInbox, covers: [R11, R21] }
    modals:
      - { id: take_over, kind: status, title: Take over from the AI agent, entity: leads, direct: patch, summary: [Name, Phone], submit: Take over, context: { AI_Mode: "Off" }, fields: [] }
      - { id: hand_back, kind: status, title: Hand back to the AI agent, entity: leads, direct: patch, summary: [Name, Phone], submit: Hand back, context: { AI_Mode: "On" }, fields: [] }
      # Declares MESSAGES.reply on this page so the server permits it; the ConversationInbox composer calls it with the typed reply.
      # (A `via: custom` action alone is not added to the role's permitted actions — kit gap, reported.) Never opened as a modal.
      - { id: send_reply, kind: custom, title: Send reply, entity: messages, flow: MESSAGES, action: reply, fields: [] }
    actions: { header: [], row: [take_over, hand_back] }

  - id: leads
    covers: [R20, R1]
    route: /leads
    group: Sales
    label: Leads
    icon: Users
    desc: Every lead from WhatsApp and calls, from first message to booked or lost
    subtitle: Every enquiry the AI agent captured, by stage
    entity: leads
    roles: [admin]
    blocks:
      - type: kpis
        kpis: [ { metric: leads_month }, { metric: unassigned }, { metric: taken_over } ]
      - type: table
        segments: { column: Stage, all: All leads }
        period: { column: Created_At, presets: [7d, 30d, month, all], default: all }
        views: [kanban, table]
        columns: [ { key: Name, type: text, sub: Phone }, { key: Stage, type: badge }, { key: Next_Followup_At, header: Follow-up, type: due }, { key: Budget_Max_INR, header: Budget up to, type: money }, { key: Broker, type: owner }, { key: Area_Pref, header: Area, type: tag }, { key: Source, type: tag }, { key: AI_Mode, header: AI, type: badge }, { key: Lead_ID, type: id, priority: low } ]
        search: [Name, Phone, Lead_ID, Area_Pref, Property_Interest]
        filters: [Source, Broker, Property_Type]
        bulk: [assign_broker]
        assign: assign_broker
        kanban: { column: Stage, stages: [New, Engaged, Visit Scheduled, Booked, Lost], locked: [Lost], title: Name, subtitle: Area_Pref, meta: [Budget_Max_INR, Next_Followup_At], avatar: Broker, move: { direct: patch } }
        drawer:
          title_column: Name
          tabs:
            - { label: Lead, sections: [ { type: tiles, title: Requirement, columns: [Purpose, Property_Type, BHK, Area_Pref, Budget_Min_INR, Budget_Max_INR] }, { type: callout, column: Summary, title: What the AI agent understood, tone: neutral }, { type: fields, columns: [Phone, Source, Broker, AI_Mode, Lang, Property_Interest, Lost_Reason], hide_empty: true } ] }
            - { label: Conversation, sections: [ { type: timeline, entity: messages, by: Lead_ID, date: At, actor: Sender, body: Text, limit: 20 } ] }
            - { label: Visits, sections: [ { type: related, entity: bookings, by: Lead_ID, title: Site visits, columns: [Property_Name, Visit_At, Broker, Status] } ] }
        empty: { title: No leads yet, reason: "Leads arrive on their own when a client messages the WhatsApp number or calls.", action: add_lead }
        actions: { header: [add_lead], row: [book_visit, assign_broker, lose] }
    modals:
      - { id: add_lead, kind: create, title: Add lead, direct: insert, submit: Add lead, success: "Lead added", context: { Stage: New, AI_Mode: "Off" }, primary: true,
          fields: [ { key: Name, label: Client name, type: text, required: true }, { key: Phone, label: Mobile, type: text, required: true, placeholder: "+91…" }, { key: Source, label: Source, type: select, options: [Walk-in, Referral, WhatsApp, Voice], default: Walk-in, required: true },
                    { key: Property_Type, label: Looking for, type: select, options: [Residential, Commercial, Plot] }, { key: Area_Pref, label: Area, type: text, placeholder: "e.g. Kolar Road" }, { key: Budget_Max_INR, label: Budget up to (₹), type: number }, { key: Broker, label: Broker, type: select, options_from: brokers.Name } ] }
      - { id: book_visit, covers: [R13], kind: custom, title: Book site visit, flow: VISITS, action: schedule_visit, submit: Book visit, pending: "Booking…", success: "Visit booked — broker alerted on WhatsApp", summary: [Name, Phone], pass: [Lead_ID, Name, Phone, Source],
          fields: [ { key: Property_Name, label: Property, type: select, options_from: properties.Name, required: true }, { key: Broker, label: Broker, type: select, options_from: brokers.Name, required: true }, { key: Visit_At, label: Visit date and time, type: date, required: true }, { key: Budget_INR, label: Budget (₹), type: number }, { key: Notes, label: Notes for the broker, type: textarea, rows: 2 } ] }
      - { id: assign_broker, kind: edit, title: Assign broker, direct: patch, summary: [Name, Area_Pref], submit: Assign, success: "Broker assigned",
          fields: [ { key: Broker, label: Broker, type: select, options_from: brokers.Name, required: true } ] }
