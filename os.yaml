header:
  covers: [R14]
  search:
    - { label: Leads, entity: leads, columns: [Lead_ID, Name, Phone, Area_Pref], title: Name, subtitle: [Stage, Broker], link: /leads, page: leads }
    - { label: Properties, entity: properties, columns: [Property_ID, Name, Area_Name], title: Name, subtitle: [Status], link: /inventory, page: inventory }
  notifications:
    - { metric: unassigned, title: Name, subtitle: [Area_Pref], date: Created_At, link: /leads, page: leads }
    - { metric: visits_today, title: Client_Name, subtitle: [Property_Name, Broker], date: Visit_At, link: /site-visits, page: visits }
    - { metric: failed_runs, title: Flow, subtitle: [Detail], date: At, link: /ai-agents, page: ai_agents }

flows:
  - name: MESSAGES
    covers: [R11]
    trigger: { tool: webhook, name: catch_webhook, auth: none }
    writes: [messages]
    actions:
      # Channel job (method/ai-pipeline.md § Split rules): the office's own reply, inside the 24-hour window, sent from the Inbox composer.
      - { name: reply, via: custom, covers: [R11], model: none,
          payload: { Lead_ID: string, Lead_Name: string, Phone: string, Broker: string, Text: string },
          sends: { tool: whatsapp, to: Phone, message: "{{Text}}" },
          result: { sent: boolean },
          rules: ["Only inside the 24-hour window after the client's last message; outside it the composer is disabled and says why"],
          typical_seconds: 4, credits: 7, runs_per_month: 200,
          effect: { insert: messages, fill: { Channel: WhatsApp, Direction: Out, Sender: Office, At: now }, map: { Lead_ID: Lead_ID, Lead_Name: Lead_Name, Phone: Phone, Broker: Broker, Text: Text } } }

  - name: VISITS
    covers: [R13]
    trigger: { tool: webhook, name: catch_webhook, auth: none }
    writes: [bookings, leads]
    actions:
      # The office books a visit from the lead: the booking row, the lead's stage, and the broker's WhatsApp alert (approved template).
      - { name: schedule_visit, covers: [R13, R7], model: none,
          payload: { Lead_ID: string, Name: string, Phone: string, Broker: string, Property_Name: string, Visit_At: string, Budget_INR: number, Source: string, Notes: string, To: string },
          sends: { tool: whatsapp, to: { entity: brokers, match: Broker, by: Name, column: Phone },
                   template: { name: broker_visit_alert, variables: { client: "{{Name}}", phone: "{{Phone}}", property: "{{Property_Name}}", budget: "{{Budget_INR}}", visit: "{{Visit_At}}" } } },
          result: { Booking_ID: string },
          typical_seconds: 5, credits: 7, runs_per_month: 20,
          effect: { insert: bookings, fill: { Status: Scheduled, Created_By: Office },
                    map: { Lead_ID: Lead_ID, Name: Client_Name, Phone: Client_Phone, Broker: Broker, Property_Name: Property_Name, Visit_At: Visit_At, Budget_INR: Budget_INR, Source: Source, Notes: Notes },
                    also: { patch: leads, map: { Broker: Broker, Property_Name: Property_Interest }, only: [Broker, Property_Interest], fill: { Stage: Visit Scheduled } } } }
      # The client's confirmation of a booked visit (approved template — the client may be outside the 24-hour window).
      - { name: confirm_client, covers: [R13], model: none,
          payload: { Booking_ID: string, Client_Name: string, Client_Phone: string, Property_Name: string, Visit_At: string, Broker: string },
          sends: { tool: whatsapp, to: Client_Phone,
                   template: { name: visit_confirmation, variables: { name: "{{Client_Name}}", property: "{{Property_Name}}", visit: "{{Visit_At}}", broker: "{{Broker}}" } } },
          result: { sent: boolean },
          typical_seconds: 4, credits: 7, runs_per_month: 38,
          effect: { patch: bookings, fill: { Notes: "Confirmation sent to client on WhatsApp" } } }

pages:
