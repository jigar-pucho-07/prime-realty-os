          fields: [ { key: Broker, label: Broker, type: select, options_from: brokers.Name, required: true } ] }
      - { id: visit_outcome, kind: status, title: Visit outcome, entity: bookings, direct: patch, summary: [Client_Name, Property_Name], submit: Save outcome,
