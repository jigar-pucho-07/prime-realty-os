    modals:
      - { id: add_property, covers: [R12], kind: create, title: Add property, direct: insert, size: lg, submit: Add property, success: "Property added", context: { City: Bhopal, Status: Available, Size_Unit: sq.ft }, primary: true,
          # 8 fields — the R12 list (name, type, location, price range, BHK, area, tags; status starts Available). Floor, parking,
          # possession and the unit are details added with Edit (U6: keep the first form short)
          fields: [ { key: Name, label: Property name, type: text, required: true, placeholder: "e.g. 3BHK Luxury Apartment" }, { key: Type, label: Type, type: select, options: [Residential, Commercial, Plot], required: true },
                    { key: Area_Name, label: Location, type: text, required: true, placeholder: "Area, e.g. Kolar Road" }, { key: Config, label: BHK / config, type: select, options: [1 BHK, 2 BHK, 3 BHK, 4 BHK, Shop, Office, Plot, Land], required: true },
                    { key: Price_Min_INR, label: Price from (₹), type: number, required: true }, { key: Price_Max_INR, label: Price to (₹), type: number, required: true },
                    { key: Size, label: Area (sq.ft), type: number }, { key: Tags, label: Tags (comma separated), type: text, placeholder: "Ready to Move, Gated Society, RERA Approved" } ] }
      - { id: edit_property, kind: edit, title: Edit property, direct: patch, summary: [Name, Area_Name], submit: Save,
          fields: [ { key: Price_Min_INR, label: Price from (₹), type: number }, { key: Price_Max_INR, label: Price to (₹), type: number }, { key: Size, label: Area, type: number }, { key: Size_Unit, label: Unit, type: select, options: [sq.ft, sq.yd, acre] },
                    { key: Floor, label: Floor, type: text }, { key: Parking, label: Parking, type: text }, { key: Possession, label: Possession, type: text, placeholder: "Ready to Move / Dec 2026" }, { key: Tags, label: Tags, type: text } ] }
      - { id: set_status, kind: status, title: Change status, direct: patch, summary: [Name, Status], submit: Save,
